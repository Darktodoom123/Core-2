name: core2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}"
        VITE_REVERB_HOST: "${VITE_REVERB_HOST:-localhost}"
        VITE_REVERB_PORT: "${VITE_REVERB_PORT:-8080}"
        VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME:-http}"
    container_name: core2-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_SSLMODE: "${DB_SSLMODE:-prefer}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-reverb}"
      REVERB_APP_ID: "${REVERB_APP_ID:?Set REVERB_APP_ID in .env}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}"
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: core2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:?Set DB_DATABASE in .env}"
      POSTGRES_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: core2-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runner
    profiles: ["test"]
    working_dir: /var/www/html
    entrypoint: []
    command: ["php", "vendor/bin/pest", "--configuration=phpunit.concurrency.xml", "--testsuite=Concurrency"]
    environment:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: core2_concurrency_test
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_SSLMODE: disable
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
      PULSE_ENABLED: "false"
      TELESCOPE_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  storage-data:
  postgres-data:
  redis-data:
