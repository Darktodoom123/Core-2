name: "${COMPOSE_PROJECT_NAME:-core2}"

services:
  app:
    image: "${CORE2_APP_IMAGE:-core2/runtime:ci}"
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
      args:
        VITE_PUBLIC_REVERB_IDENTIFIER: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}"
        VITE_REVERB_HOST: "${VITE_REVERB_HOST:-localhost}"
        VITE_REVERB_PORT: "${VITE_REVERB_PORT:-8080}"
        VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME:-http}"
        VITE_MAP_PROVIDER: "${VITE_MAP_PROVIDER:-stadia}"
        VITE_MAP_PLAN: "${VITE_MAP_PLAN:-free}"
        VITE_MAP_USE_CASE: "${VITE_MAP_USE_CASE:-commercial}"
        VITE_MAP_STYLE_URL: "${VITE_MAP_STYLE_URL:-}"
        VITE_MAP_ATTRIBUTION: "${VITE_MAP_ATTRIBUTION:-}"
        VITE_STADIA_MAPS_API_KEY: "${VITE_STADIA_MAPS_API_KEY:-}"
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "${PORT:-8000}:80"
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_SSLMODE: "${DB_SSLMODE:-prefer}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-mini}"
      OPENAI_MAX_INPUT_TOKENS: "${OPENAI_MAX_INPUT_TOKENS:-32000}"
      OPENAI_MAX_COST_USD: "${OPENAI_MAX_COST_USD:-0.05}"
      OPENAI_PROACTIVE_ENABLED: "${OPENAI_PROACTIVE_ENABLED:-true}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-reverb}"
      REVERB_APP_ID: "${REVERB_APP_ID:?Set REVERB_APP_ID in .env}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}"
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      CACHE_CONFIG: "${CACHE_CONFIG:-true}"
      TRACKING_SERVICE_DRIVER: http
      TRACKING_SERVICE_URL: http://tracking
      TRACKING_SERVICE_SECRET: "${TRACKING_SERVICE_SECRET:?Set TRACKING_SERVICE_SECRET in .env}"
      CORE2_SERVICE_NAME: operations
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      tracking:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  tracking:
    image: "${CORE2_TRACKING_IMAGE:-core2/tracking:ci}"
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: tracking-runtime
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      APP_NAME: TrackingService
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${TRACKING_APP_KEY:?Set TRACKING_APP_KEY in .env}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${TRACKING_APP_URL:-http://localhost:8001}"
      DB_CONNECTION: "${TRACKING_DB_CONNECTION:-pgsql}"
      DB_HOST: "${TRACKING_DB_HOST:-tracking-db}"
      DB_PORT: "${TRACKING_DB_PORT:-5432}"
      DB_DATABASE: "${TRACKING_DB_DATABASE:?Set TRACKING_DB_DATABASE in .env}"
      DB_USERNAME: "${TRACKING_DB_USERNAME:?Set TRACKING_DB_USERNAME in .env}"
      DB_PASSWORD: "${TRACKING_DB_PASSWORD:?Set TRACKING_DB_PASSWORD in .env}"
      DB_SSLMODE: "${TRACKING_DB_SSLMODE:-prefer}"
      TRACKING_SERVICE_SECRET: "${TRACKING_SERVICE_SECRET:?Set TRACKING_SERVICE_SECRET in .env}"
      TRACKING_ALLOWED_SERVICES: "${TRACKING_ALLOWED_SERVICES:-operations}"
      CACHE_STORE: file
      CACHE_PREFIX: "${TRACKING_CACHE_PREFIX:-core2_tracking_cache_}"
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      RUN_MIGRATIONS: "${TRACKING_RUN_MIGRATIONS:-true}"
      CACHE_CONFIG: "${TRACKING_CACHE_CONFIG:-true}"
      DB_WAIT_TIMEOUT_SECONDS: "${TRACKING_DB_WAIT_TIMEOUT_SECONDS:-60}"
      DB_WAIT_INTERVAL_SECONDS: "${TRACKING_DB_WAIT_INTERVAL_SECONDS:-2}"
      DB_WAIT_PROBE_TIMEOUT_SECONDS: "${TRACKING_DB_WAIT_PROBE_TIMEOUT_SECONDS:-5}"
      MIGRATION_TIMEOUT_SECONDS: "${TRACKING_MIGRATION_TIMEOUT_SECONDS:-120}"
      CORE2_SERVICE_NAME: tracking
      BROADCAST_CONNECTION: "null"
    volumes:
      - tracking-storage-data:/var/www/html/storage
    depends_on:
      tracking-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  tracking-db:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: "${TRACKING_DB_DATABASE:?Set TRACKING_DB_DATABASE in .env}"
      POSTGRES_USER: "${TRACKING_DB_USERNAME:?Set TRACKING_DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${TRACKING_DB_PASSWORD:?Set TRACKING_DB_PASSWORD in .env}"
    volumes:
      - tracking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: "${DB_DATABASE:?Set DB_DATABASE in .env}"
      POSTGRES_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine3.21@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  test:
    image: "${CORE2_TEST_IMAGE:-core2/test-runner:ci}"
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: test-runner
    profiles: ["test"]
    working_dir: /var/www/html
    # R6 expects a migrated schema; R3's DatabaseMigrations cleanup runs after
    # its file, so keep R6 first in this single test process.
    command:
      - php
      - vendor/bin/pest
      - --configuration=phpunit.concurrency.xml
      - tests/Concurrency/RentalSalesAssetUsageConcurrencyTest.php
      - tests/Concurrency/GptRecommendationRowLockConcurrencyTest.php
      - tests/Concurrency/HosShiftConcurrencyTest.php
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: core2_concurrency_test
      DB_ADMIN_DATABASE: postgres
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_SSLMODE: disable
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
      PULSE_ENABLED: "false"
      TELESCOPE_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  storage-data:
  postgres-data:
  redis-data:
  tracking-storage-data:
  tracking-postgres-data:
