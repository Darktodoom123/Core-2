name: docker

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/workos' }}

env:
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://localhost:18000
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: core2_ci
  DB_USERNAME: core2_ci
  DB_PASSWORD: core2-ci-database-password
  DB_SSLMODE: disable
  REVERB_APP_ID: core2-ci
  REVERB_APP_KEY: core2-ci-public-key
  REVERB_APP_SECRET: core2-ci-reverb-secret
  VITE_REVERB_HOST: localhost
  VITE_REVERB_PORT: "18080"
  VITE_REVERB_SCHEME: http
  VITE_MAP_PROVIDER: stadia
  VITE_MAP_PLAN: starter
  VITE_MAP_USE_CASE: commercial
  VITE_MAP_STYLE_URL: https://tiles.stadiamaps.com/styles/core2-ci.json
  VITE_MAP_ATTRIBUTION: Core2 CI map attribution
  VITE_STADIA_MAPS_API_KEY: core2-ci-public-map-key
  PORT: "18000"
  REVERB_FORWARD_PORT: "18080"
  RUN_MIGRATIONS: "true"
  CACHE_CONFIG: "true"
  TRACKING_APP_KEY: base64:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
  TRACKING_DB_CONNECTION: pgsql
  TRACKING_DB_HOST: tracking-db
  TRACKING_DB_PORT: "5432"
  TRACKING_DB_DATABASE: core2_tracking_ci
  TRACKING_DB_USERNAME: core2_tracking_ci
  TRACKING_DB_PASSWORD: core2-tracking-ci-database-password
  TRACKING_DB_SSLMODE: disable
  TRACKING_SERVICE_DRIVER: http
  TRACKING_SERVICE_URL: http://tracking
  TRACKING_SERVICE_SECRET: core2-ci-tracking-service-secret
  TRACKING_ALLOWED_SERVICES: operations
  TRACKING_RUN_MIGRATIONS: "true"
  TRACKING_CACHE_CONFIG: "true"

jobs:
  changes:
    name: Detect Docker Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            should_run:
              - 'infra/**'
              - 'docker-compose.yml'
              - 'docker-compose.*.yml'
              - '.dockerignore'
              - 'apps/operations/**'
              - 'apps/tracking/**'
              - 'packages/field-mobile/**'
              - 'scripts/test-integration-services.ts'
              - 'scripts/verify-frontend-build.cjs'
              - 'third_party/image-size/**'
              - '.nvmrc'
              - '.env.example'
              - 'package.json'
              - 'package-lock.json'
              - 'composer.json'
              - 'composer.lock'
              - '.github/workflows/docker.yml'

  build:
    name: build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Check Dockerfile
        shell: bash
        run: |
          for attempt in 1 2 3; do
            docker buildx build --check -f infra/docker/Dockerfile . && break || {
              if [ "$attempt" -lt 3 ]; then
                echo "Dockerfile check attempt $attempt failed; retrying in 3s..."
                sleep 3
              else
                echo "Dockerfile check failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./infra/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: core2/runtime:ci
          build-args: |
            VITE_PUBLIC_REVERB_IDENTIFIER=${{ env.REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ env.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ env.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ env.VITE_REVERB_SCHEME }}
            VITE_MAP_PROVIDER=${{ env.VITE_MAP_PROVIDER }}
            VITE_MAP_PLAN=${{ env.VITE_MAP_PLAN }}
            VITE_MAP_USE_CASE=${{ env.VITE_MAP_USE_CASE }}
            VITE_MAP_STYLE_URL=${{ env.VITE_MAP_STYLE_URL }}
            VITE_MAP_ATTRIBUTION=${{ env.VITE_MAP_ATTRIBUTION }}
            VITE_STADIA_MAPS_API_KEY=${{ env.VITE_STADIA_MAPS_API_KEY }}
          cache-from: type=gha,scope=core2-runtime
          cache-to: type=gha,mode=max,scope=core2-runtime

      - name: Build Tracking image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./infra/docker/Dockerfile
          target: tracking-runtime
          push: false
          load: true
          tags: core2/tracking:ci
          cache-from: |
            type=gha,scope=core2-tracking
            type=gha,scope=core2-runtime
          cache-to: type=gha,mode=max,scope=core2-tracking

      - name: Verify production frontend map configuration
        shell: bash
        env:
          VITE_MAP_PROVIDER: ${{ env.VITE_MAP_PROVIDER }}
          VITE_MAP_PLAN: ${{ env.VITE_MAP_PLAN }}
          VITE_MAP_USE_CASE: ${{ env.VITE_MAP_USE_CASE }}
          VITE_MAP_STYLE_URL: ${{ env.VITE_MAP_STYLE_URL }}
          VITE_MAP_ATTRIBUTION: ${{ env.VITE_MAP_ATTRIBUTION }}
          VITE_STADIA_MAPS_API_KEY: ${{ env.VITE_STADIA_MAPS_API_KEY }}
          CORE2_SERVER_SECRET: ${{ env.REVERB_APP_SECRET }}
        run: |
          set -Eeuo pipefail
          rm -rf frontend-build
          mkdir -p frontend-build
          container="$(docker create core2/runtime:ci)"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/var/www/html/public/build/." frontend-build/
          node scripts/verify-frontend-build.cjs frontend-build

      - name: Build concurrency test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./infra/docker/Dockerfile
          target: test-runner
          push: false
          load: true
          tags: core2/test-runner:ci
          cache-from: |
            type=gha,scope=core2-test
            type=gha,scope=core2-runtime
          cache-to: type=gha,mode=max,scope=core2-test

      - name: Run isolated service integration contract
        env:
          CORE2_APP_IMAGE: core2/runtime:ci
          CORE2_TRACKING_IMAGE: core2/tracking:ci
          CORE2_INTEGRATION_NO_BUILD: "true"
        run: npm run test:integration:services

      - name: Start stack and run bounded smoke/test checks
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            local exit_code=$?
            if (( exit_code != 0 )); then
              echo "::group::Compose Service Status on Failure"
              docker compose ps || true
              echo "::endgroup::"
              echo "::group::Compose Logs on Failure"
              docker compose logs --no-color app db redis tracking tracking-db test || true
              echo "::endgroup::"
            fi
            docker compose down -v || true
          }
          trap cleanup EXIT

          docker compose up --detach --no-build

          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            ready=1
            for service in db redis app tracking tracking-db; do
              container="$(docker compose ps -q "$service")"
              if [[ -z "$container" ]]; then
                ready=0
                continue
              fi

              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              if [[ "$status" != "healthy" ]]; then
                ready=0
              fi
            done

            if (( ready == 1 )); then
              break
            fi
            sleep 5
          done

          if (( ready != 1 )); then
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18000/up
          docker compose --profile test run --rm test
