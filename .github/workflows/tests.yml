name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/workos' }}

jobs:
  changes:
    name: Detect Test Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      database: ${{ steps.filter.outputs.database }}
      browser: ${{ steps.filter.outputs.browser }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            backend:
              - 'apps/operations/**'
              - '!apps/operations/resources/js/**'
              - '!apps/operations/resources/css/**'
              - '!apps/operations/vite.config.ts'
              - '!apps/operations/.prettierignore'
              - 'apps/tracking/**'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - 'pint.json'
              - '.github/workflows/tests.yml'
            database:
              - 'apps/operations/**'
              - '!apps/operations/resources/js/**'
              - '!apps/operations/resources/css/**'
              - '!apps/operations/vite.config.ts'
              - '!apps/operations/.prettierignore'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - '.github/workflows/tests.yml'
            browser:
              - 'apps/operations/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'playwright.config.ts'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - 'third_party/image-size/**'
              - '.github/workflows/tests.yml'
            mobile:
              - 'packages/field-mobile/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'tsconfig.json'
              - 'third_party/image-size/**'
              - '.github/workflows/tests.yml'

  backend:
    name: Backend Tests & Static Analysis
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, xml, curl, zip, gd, intl, sqlite3, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/operations/composer.lock', 'apps/tracking/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: |
          composer --working-dir=apps/operations install --no-interaction --prefer-dist --optimize-autoloader --no-progress
          composer --working-dir=apps/tracking install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: |
          cp .env.example .env
          cp apps/operations/.env.example apps/operations/.env
          cp apps/tracking/.env.example apps/tracking/.env

      - name: Generate Application Key
        run: |
          php apps/operations/artisan key:generate
          php apps/tracking/artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Operations backend test suite
        run: |
          mkdir -p test-results
          php apps/operations/artisan config:clear --ansi
          apps/operations/vendor/bin/pest --configuration=apps/operations/phpunit.xml --log-junit=test-results/junit-backend.xml

      - name: Tracking microservice test suite
        if: success() || failure()
        run: |
          mkdir -p test-results
          apps/tracking/vendor/bin/pest --configuration=apps/tracking/phpunit.xml --log-junit=test-results/junit-tracking.xml

      - name: Upload backend JUnit results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: junit-backend
          path: |
            test-results/junit-backend.xml
            test-results/junit-tracking.xml
          retention-days: 7
          if-no-files-found: warn

  browser-acceptance:
    name: Browser Acceptance & Accessibility
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, xml, curl, zip, gd, intl, sqlite3, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/operations/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: |
          composer --working-dir=apps/operations install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: |
          cp .env.example .env
          cp apps/operations/.env.example apps/operations/.env

      - name: Generate Application Key
        run: php apps/operations/artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility smoke test
        env:
          BROADCAST_CONNECTION: 'null'
          BROADCAST_DRIVER: 'null'
          PLAYWRIGHT_JUNIT_OUTPUT: test-results/junit-a11y.xml
        run: npm run test:a11y

      - name: Browser acceptance suite
        if: success() || failure()
        env:
          BROADCAST_CONNECTION: 'null'
          BROADCAST_DRIVER: 'null'
          PLAYWRIGHT_JUNIT_OUTPUT: test-results/junit-e2e.xml
        run: npm run test:e2e

      - name: Upload Playwright test results and report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database-security:
    name: PostgreSQL Security & Concurrency
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: core2_bootstrap
          POSTGRES_PASSWORD: core2_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core2_bootstrap -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, xml, curl, zip, pdo_pgsql, gd, intl, sqlite3, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/operations/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          composer --working-dir=apps/operations install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: |
          cp .env.example .env
          cp apps/operations/.env.example apps/operations/.env

      - name: Generate Application Key
        run: php apps/operations/artisan key:generate

      - name: Prepare isolated PostgreSQL test roles and databases
        env:
          PGPASSWORD: core2_bootstrap
        run: |
          psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'core2_app') THEN
              CREATE ROLE core2_app LOGIN PASSWORD 'core2_app' NOSUPERUSER NOBYPASSRLS;
            ELSE
              ALTER ROLE core2_app WITH LOGIN PASSWORD 'core2_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          SQL
          for database in core2_rental_sales_test core2_concurrency_test; do
            if ! psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '$database'" | grep -q 1; then
              psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres --command="CREATE DATABASE $database OWNER core2_app;"
            else
              psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres --command="ALTER DATABASE $database OWNER TO core2_app;"
            fi
          done

      - name: PostgreSQL row-lock and server-only security gates
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: core2_concurrency_test
          DB_USERNAME: core2_app
          DB_PASSWORD: core2_app
          BROADCAST_CONNECTION: 'null'
          BROADCAST_DRIVER: 'null'
        run: |
          mkdir -p test-results
          php apps/operations/artisan migrate --force --database=pgsql
          apps/operations/vendor/bin/pest --configuration=apps/operations/phpunit.concurrency.xml --test-directory=tests --testsuite=Concurrency --log-junit=test-results/junit-concurrency.xml

      - name: PostgreSQL Rental and Sales RLS/grant tests
        if: success() || failure()
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: core2_rental_sales_test
          DB_USERNAME: core2_app
          DB_PASSWORD: core2_app
          DB_SSLMODE: disable
          BROADCAST_CONNECTION: 'null'
          BROADCAST_DRIVER: 'null'
        run: apps/operations/vendor/bin/pest --configuration=apps/operations/phpunit.postgresql.xml --test-directory=tests --testsuite=PostgreSQL --log-junit=test-results/junit-postgresql.xml

      - name: Upload PostgreSQL JUnit results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: junit-postgresql
          path: |
            test-results/junit-concurrency.xml
            test-results/junit-postgresql.xml
          retention-days: 7
          if-no-files-found: warn

  mobile:
    name: Mobile Package & Bundling
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Mobile Package Typecheck
        run: npm run types:check:mobile

      - name: Mobile Package Tests
        if: success() || failure()
        run: npm run test:mobile

      - name: Mobile Expo Doctor
        if: success() || failure()
        working-directory: packages/field-mobile
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npm run doctor

      - name: Mobile Android Bundle Export
        if: success() || failure()
        working-directory: packages/field-mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npm run export:android
