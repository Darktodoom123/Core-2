name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core2_concurrency_test
          POSTGRES_USER: core2_test
          POSTGRES_PASSWORD: core2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core2_test -d core2_concurrency_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        php-version: ['8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug
          extensions: mbstring, xml, curl, zip, pdo_pgsql, gd, intl

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility smoke test
        run: npm run test:a11y

      - name: Browser acceptance suite
        run: npm run test:e2e

      - name: Mobile Package Typecheck
        run: npm run types:check:mobile

      - name: Mobile Package Tests
        run: npm run test:mobile

      - name: Mobile Expo Doctor
        working-directory: packages/field-mobile
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npm run doctor

      - name: Mobile Android Bundle Export
        working-directory: packages/field-mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npm run export:android

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test

      - name: PostgreSQL GPT row-lock concurrency tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: core2_test
          DB_PASSWORD: core2_test
        run: php artisan test --configuration=phpunit.concurrency.xml --testsuite=Concurrency
