name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: core2_bootstrap
          POSTGRES_PASSWORD: core2_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core2_bootstrap -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug
          extensions: mbstring, xml, curl, zip, pdo_pgsql, gd, intl, sqlite3, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prepare isolated PostgreSQL test roles and databases
        env:
          PGPASSWORD: core2_bootstrap
        run: |
          psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'core2_app') THEN
              CREATE ROLE core2_app LOGIN PASSWORD 'core2_app' NOSUPERUSER NOBYPASSRLS;
            ELSE
              ALTER ROLE core2_app WITH LOGIN PASSWORD 'core2_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          SQL
          for database in core2_rental_sales_test core2_concurrency_test; do
            if ! psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '$database'" | grep -q 1; then
              psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres --command="CREATE DATABASE $database OWNER core2_app;"
            else
              psql --host=127.0.0.1 --port=5432 --username=core2_bootstrap --dbname=postgres --command="ALTER DATABASE $database OWNER TO core2_app;"
            fi
          done

      - name: Build Assets
        run: npm run build

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility smoke test
        env:
          BROADCAST_CONNECTION: 'null'
          BROADCAST_DRIVER: 'null'
        run: npm run test:a11y

      - name: Browser acceptance suite
        env:
          BROADCAST_CONNECTION: 'null'
          BROADCAST_DRIVER: 'null'
        run: npm run test:e2e

      - name: Mobile Package Typecheck
        run: npm run types:check:mobile

      - name: Mobile Package Tests
        run: npm run test:mobile

      - name: Mobile Expo Doctor
        working-directory: packages/field-mobile
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npm run doctor

      - name: Mobile Android Bundle Export
        working-directory: packages/field-mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npm run export:android

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test

      - name: PostgreSQL row-lock and server-only security gates
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: core2_concurrency_test
          DB_USERNAME: core2_app
          DB_PASSWORD: core2_app
        run: |
          php artisan migrate --force --database=pgsql
          vendor/bin/pest --configuration=phpunit.concurrency.xml --testsuite=Concurrency

      - name: PostgreSQL Rental and Sales RLS/grant tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: core2_rental_sales_test
          DB_USERNAME: core2_app
          DB_PASSWORD: core2_app
          DB_SSLMODE: disable
        run: vendor/bin/pest --configuration=phpunit.postgresql.xml --testsuite=PostgreSQL
