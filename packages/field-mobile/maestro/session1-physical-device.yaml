appId: com.core2.fieldmobile
name: Session 1 physical-device field journey
---
- launchApp:
      clearState: true
- tapOn: 'http://'
- inputText: 'http://127.0.0.1:18081'
- tapOn: Connect
- extendedWaitUntil:
      visible:
          id: login-screen
      timeout: 60000
- tapOn:
      id: login-username-input
- inputText: ${FIELD_TEST_USERNAME}
- tapOn:
      id: login-password-input
- inputText: ${FIELD_TEST_PASSWORD}
- hideKeyboard
- tapOn:
      id: login-submit-button
- assertVisible: Active Field Assignments
- assertNotVisible: ${FORBIDDEN_JOB_REFERENCE}
- stopApp
- launchApp
- assertVisible: Active Field Assignments
- tapOn: Sign out
- assertVisible:
      id: login-screen
